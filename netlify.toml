# Netlify bouwt de site met Astro en zet /dist live.
# De functie in netlify/functions zet wachtlijst-aanmeldingen door naar Brevo.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Oude losse adressen netjes doorsturen
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
